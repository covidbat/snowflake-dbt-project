name: 'pm_sales_nps'
version: '1.0.0'
config-version: 2

profile: 'pm_sales_nps'

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# No seed-paths: raw data now arrives via Snowpipe from S3, not CSV seeds.

models:
  pm_sales_nps:
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: view
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
      # facts override to incremental in-model (see fct_*.sql)
