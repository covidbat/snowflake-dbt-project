name: 'arm_analytics'
version: '1.0.0'
config-version: 2

# This profile must exist in your profiles.yml (dbt Core) or be
# configured in the dbt Cloud connection UI.
profile: 'arm_analytics'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ---------------------------------------------------------------------------
# Medallion layering. Bronze/Silver stay cheap as views; Gold is queried by
# BI tools so we persist it as tables.
# ---------------------------------------------------------------------------
models:
  arm_analytics:
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: view
      +schema: silver
    gold:
      +materialized: table
      +schema: gold

seeds:
  arm_analytics:
    +schema: raw          # seeds simulate raw ingestion -> RAW schema
