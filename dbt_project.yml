name: 'pm_sales_nps'
version: '1.0.0'
config-version: 2

profile: 'pm_sales_nps'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Seeds stand in for RAW so the project runs without S3/Snowpipe.

models:
  pm_sales_nps:
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: view
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
      # facts override to incremental in-model (see fct_*.sql)

seeds:
  pm_sales_nps:
    +schema: raw
