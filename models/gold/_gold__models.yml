version: 2

models:
  - name: dim_product
    columns:
      - name: product_sk
        tests: [unique, not_null]
  - name: dim_customer
    columns:
      - name: customer_sk
        tests: [unique, not_null]
      - name: market_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_market')
                field: market_sk
  - name: dim_sales_rep
    columns:
      - name: sales_rep_sk
        tests: [unique, not_null]
  - name: dim_market
    columns:
      - name: market_sk
        tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]
  - name: fct_sales
    description: "Grain: one sales transaction line. Incremental (merge)."
    columns:
      - name: sale_sk
        tests: [unique, not_null]
      - name: product_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_sk
      - name: net_amount
        tests: [not_null]
  - name: fct_nps_response
    description: "Grain: one NPS survey response. Incremental (merge)."
    columns:
      - name: nps_sk
        tests: [unique, not_null]
      - name: customer_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_sk
