version: 2

models:
  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: stg_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: channel_type
        tests:
          - accepted_values:
              arguments:
                values: ['CONVENIENCE', 'SUPERMARKET', 'WHOLESALE', 'HORECA', 'ONLINE']
  - name: stg_sales_reps
    columns:
      - name: sales_rep_id
        tests: [unique, not_null]
  - name: stg_markets
    columns:
      - name: market_id
        tests: [unique, not_null]
  - name: stg_sales_transactions
    columns:
      - name: sale_id
        tests: [unique, not_null]
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
  - name: stg_nps_responses
    columns:
      - name: response_id
        tests: [unique, not_null]
      - name: nps_score
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 10
      - name: nps_category
        tests:
          - accepted_values:
              arguments:
                values: ['Promoter', 'Passive', 'Detractor', 'Invalid']
