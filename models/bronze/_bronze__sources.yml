version: 2

sources:
  - name: pm_raw
    schema: raw
    description: "Raw feeds landed by Snowpipe from S3 (migrated from SQL Server)."
    config:
      loaded_at_field: _load_ts
      freshness:
        warn_after:  {count: 24, period: hour}
        error_after: {count: 48, period: hour}
    tables:
      - name: raw_sales_transactions
      - name: raw_products
      - name: raw_customers
      - name: raw_sales_reps
      - name: raw_markets
      - name: raw_nps_responses
